<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#171717">
    <meta name="description"
          content="Descubre Centro Gous en Sabadell. Taekwondo para niños y adultos, yoga, hapkido y defensa personal. ¡Ven a conocernos!">

    <title>Centro Gous | Taekwondo y artes marciales en Sabadell</title>

    <link rel="icon" type="image/png" href="assets/img/icon.png">

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="assets/css/site.css">
</head>

<body data-bs-spy="scroll"
      data-bs-target="#mainNav"
      data-bs-smooth-scroll="true"
      data-bs-root-margin="0px 0px -25%"
      tabindex="0">

<!-- Navegación principal -->
<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand brand-lockup" href="#hero" aria-label="Centro Gous, inicio">
                <img src="assets/img/logo-circle.png"
                     alt="Logotipo de Centro Gous"
                     class="brand-logo">

                <span class="brand-text">
                        <span class="brand-name">CENTRO GOUS</span>
                        <span class="brand-location">SABADELL</span>
                    </span>
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav"
                    aria-controls="mainNav"
                    aria-expanded="false"
                    aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="#hero">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#actividades">Actividades</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#horarios">Horarios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contacto">Contacto</a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-gous btn-nav"
                           href="https://wa.me/34644891810"
                           target="_blank"
                           rel="noopener noreferrer">
                            <i class="bi bi-whatsapp" aria-hidden="true"></i>
                            Ven a conocernos
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>
</header>

<!-- Contenido principal: cada sección se carga desde su parcial -->
<main id="contenido">
    <div data-include="partials/home-hero.html">
        <div class="section-loading" aria-label="Cargando portada"></div>
    </div>

    <div data-include="partials/home-actividades.html">
        <div class="section-loading" aria-label="Cargando actividades"></div>
    </div>

    <div data-include="partials/home-gallery.html">
        <div class="section-loading" aria-label="Cargando galería"></div>
    </div>

    <div data-include="partials/home-horarios.html">
        <div class="section-loading" aria-label="Cargando horarios"></div>
    </div>

    <div data-include="partials/home-contacto.html">
        <div class="section-loading" aria-label="Cargando contacto"></div>
    </div>
</main>

<!-- Pie de página -->
<footer class="site-footer">
    <div class="container">
        <div class="footer-content">
            <a href="#hero" class="footer-brand" aria-label="Volver al inicio">
                <img src="assets/img/logo-circle.png"
                     alt=""
                     class="footer-logo">
                <span>CENTRO GOUS</span>
            </a>

            <p class="footer-copy">
                Taekwondo, artes marciales y bienestar en Sabadell.
            </p>

            <div class="footer-social">
                <a href="https://www.instagram.com/centrogous/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Instagram de Centro Gous">
                    <i class="bi bi-instagram" aria-hidden="true"></i>
                </a>

                <a href="https://www.facebook.com/escolagousvalls"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Facebook de Centro Gous">
                    <i class="bi bi-facebook" aria-hidden="true"></i>
                </a>
            </div>
        </div>

        <div class="footer-bottom">
            <span>© <span data-current-year></span> Centro Gous</span>
            <a href="#hero">Volver arriba <i class="bi bi-arrow-up" aria-hidden="true"></i></a>
        </div>
    </div>
</footer>

<!-- Acceso rápido a WhatsApp -->
<a class="whatsapp-float-btn"
   href="https://wa.me/34644891810"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="Contactar con Centro Gous por WhatsApp">
    <i class="bi bi-whatsapp" aria-hidden="true"></i>
</a>

<!-- Bootstrap y lógica propia -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
