
<section id="galeria" class="section section-dark position-relative overflow-hidden">
  <div class="container">
    <div class="section-heading">
      <span class="section-kicker">Instalaciones y Ambiente</span>
      <h2>El Dojo en <span>Acción</span></h2>
      <p>
        Espacios equipados con tatami profesional y material homologado
        para una práctica segura y exigente en Sabadell.
      </p>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div
                id="gousGalleryCarousel"
                class="carousel slide carousel-fade shadow-lg rounded-3 overflow-hidden"
                data-bs-ride="carousel"
                data-bs-interval="5000">

          <div class="carousel-indicators"></div>

          <div class="carousel-inner">
            <div class="carousel-item active">
              <div class="ratio ratio-16x9 d-flex align-items-center justify-content-center">
                <p class="text-white mb-0">Carregant galeria...</p>
              </div>
            </div>
          </div>

          <button
                  class="carousel-control-prev"
                  type="button"
                  data-bs-target="#gousGalleryCarousel"
                  data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>

          <button
                  class="carousel-control-next"
                  type="button"
                  data-bs-target="#gousGalleryCarousel"
                  data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>

        </div>
      </div>
    </div>
  </div>
</section>
